# Configuration Nginx : reverse proxy HTTPS vers le serveur webhook local (port 8000)
# À placer dans /etc/nginx/sites-available/donbot puis activer avec :
#   sudo ln -s /etc/nginx/sites-available/donbot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Ensuite : sudo certbot --nginx -d votre-domaine.com

server {
    listen 80;
    server_name votre-domaine.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
